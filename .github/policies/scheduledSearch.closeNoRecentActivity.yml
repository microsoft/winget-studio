id: scheduledSearch.closeNoRecentActivity
name: GitOps.PullRequestIssueManagement
description: Closes issues that are inactive
owner: 
resource: repository
disabled: false
where: 
configuration:
  resourceManagementConfiguration:
    scheduledSearches:
    - description: >-
          Search for Issues where -
          * Issue is Open
          * Issue has the label Needs-Author-Feedback
          * Issue has the label No-Recent-Activity
          * Has not had activity in the last 5 days
          Then -
          * Close the Issue
      frequencies:
      - hourly:
          hour: 6
      filters:
      - isIssue
      - isOpen
      - hasLabel:
          label: Needs-Author-Feedback
      - hasLabel:
          label: No-Recent-Activity
      - noActivitySince:
          days: 5
      actions:
      - closeIssue
    - description: >-
          Search for PRs where -
          * Pull Request is Open
          * Pull Request has the label Needs-Author-Feedback
          * Pull Request has the label No-Recent-Activity
          * Has not had activity in the last 5 days
          Then -
          * Close the PR
      frequencies:
      - hourly:
          hour: 6
      filters:
      - isPullRequest
      - isOpen
      - hasLabel:
          label: Needs-Author-Feedback
      - hasLabel:
          label: No-Recent-Activity
      - noActivitySince:
          days: 5
      actions:
      - closeIssue
onFailure: 
onSuccess: 