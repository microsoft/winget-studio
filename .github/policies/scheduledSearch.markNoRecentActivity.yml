id: scheduledSearch.markNoRecentActivity
name: GitOps.PullRequestIssueManagement
description: Marks issues that are inactive
owner: 
resource: repository
disabled: false
where: 
configuration:
  resourceManagementConfiguration:
    scheduledSearches:
    - description: >-
          Search for Issues where -
          * Issue is Open
          * Issue has the label Needs-Author-Feedback
          * Issue does not have the label No-Recent-Activity
          * Has not had activity in the last 5 days
          Then -
          * Mark the issue as No-Recent-Activity
      frequencies:
      - hourly:
          hour: 6
      filters:
      - isIssue
      - isOpen
      - hasLabel:
          label: Needs-Author-Feedback
      - noActivitySince:
          days: 5
      - isNotLabeledWith:
          label: No-Recent-Activity
      actions:
      - addLabel:
          label: No-Recent-Activity
    - description: >-
          Search for PRs where -
          * Pull Request is Open
          * Pull Request has the label Needs-Author-Feedback
          * Pull Request does not have the label No-Recent-Activity
          * Has not had activity in the last 5 days
          Then -
          * Mark the PR as No-Recent-Activity
      frequencies:
      - hourly:
          hour: 6
      filters:
      - isPullRequest
      - isOpen
      - hasLabel:
          label: Needs-Author-Feedback
      - noActivitySince:
          days: 5
      - isNotLabeledWith:
          label: No-Recent-Activity
      actions:
      - addLabel:
          label: No-Recent-Activity
onFailure: 
onSuccess: 